[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_runner"]

[project]
name = "pipeline-runner"
version = "0.1.0"
description = "CI/CD pipeline runner for SkillForge"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [{ name = "SkillForge Team" }]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.scripts]
pipeline-runner = "pipeline_runner.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=pipeline_runner --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["pipeline_runner"]

[tool.coverage.report]
skip_covered = false
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pipeline_runner", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.uv]
managed = true
